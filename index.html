<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product Customizer</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="customizer">
    <div class="preview-stage" id="previewStage">
      <img id="productImage" src="" alt="Product preview" />
      <div id="previewText" class="preview-text draggable"></div>
      <div id="previewTitleText" class="preview-text preview-title draggable"></div>
    </div>

    <div class="controls">
      <h2 id="productName"></h2>
      <p id="productPrice"></p>

      <label for="categorySelect">Product Type</label>
      <select id="categorySelect"></select>

      <label for="seriesSelect">Design Series</label>
      <select id="seriesSelect"></select>

      <label id="recipientLabel" for="recipientInput">Recipient Name</label>
      <input id="recipientInput" type="text" maxlength="40" />

      <label id="titleLabel" for="titleInput">Title</label>
      <input id="titleInput" type="text" maxlength="40" />

      <label for="fontSelect">Font</label>
      <select id="fontSelect">
        <option class="preset-font-option" value="Georgia, 'Times New Roman', serif">Classic Serif</option>
        <option class="preset-font-option" value="Arial, Helvetica, sans-serif">Modern Sans</option>
        <option class="preset-font-option" value="'Brush Script MT', 'Segoe Script', cursive">Script</option>
        <option class="preset-font-option" value="Impact, 'Arial Narrow', sans-serif">Bold Impact</option>
        <option class="preset-font-option" value="'Courier New', monospace">Typewriter</option>
      </select>
      <label for="fontUpload">Or upload your own font (.ttf/.otf/.woff/.woff2)</label>
      <input id="fontUpload" type="file" accept=".ttf,.otf,.woff,.woff2" />

      <label for="sizeSelect">Size</label>
      <select id="sizeSelect"></select>

      <label for="designUpload">Add an attachment</label>
      <input id="designUpload" type="file" accept="image/*" />
      <p class="hint">Drag anything on the plaque to reposition it. Double-click an added attachment to remove it.</p>

      <button id="addToCartButton">Add to Cart</button>
      <p id="statusMessage"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
